<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>fly away ～ ふわふわうさぎ ～</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #b8e4f0;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #score-display {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    font-size: 22px; color: #fff;
    text-shadow: 0 2px 8px rgba(100,160,200,0.5);
    z-index: 20; pointer-events: none; letter-spacing: 1px;
  }
  #start-screen, #gameover-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 30; pointer-events: all;
    background: linear-gradient(180deg, #c8eef5 0%, #a8ddf0 40%, #d4eaf7 100%);
  }
  #start-screen h1 {
    font-size: clamp(36px, 8vw, 64px); color: #f0a0b0; font-style: italic;
    text-shadow: 0 2px 12px rgba(240,160,176,0.3); margin-bottom: 4px;
  }
  #start-screen h2 {
    font-size: clamp(18px, 4vw, 32px); color: #80b8d8; font-style: italic; margin-bottom: 8px;
  }
  #start-screen .jp {
    font-size: clamp(14px, 3vw, 22px); color: #c0a0b8; margin-bottom: 30px; letter-spacing: 3px;
  }
  .btn {
    padding: 14px 48px; font-size: clamp(16px, 3.5vw, 22px);
    border: none; border-radius: 40px;
    background: linear-gradient(135deg, #f8c8d8, #f0a0b8); color: #fff;
    cursor: pointer; box-shadow: 0 4px 20px rgba(240,160,184,0.4);
    transition: transform 0.15s, box-shadow 0.15s; letter-spacing: 2px; pointer-events: all;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 6px 28px rgba(240,160,184,0.55); }
  .btn:active { transform: scale(0.97); }
  #gameover-screen { display: none; }
  #gameover-screen h2 {
    font-size: clamp(28px, 6vw, 48px); color: #f0a0b0; margin-bottom: 12px;
    text-shadow: 0 2px 12px rgba(240,160,176,0.3);
  }
  #gameover-screen .final-score {
    font-size: clamp(18px, 4vw, 28px); color: #80b8d8; margin-bottom: 28px;
  }
  .controls-hint {
    font-size: clamp(11px, 2.5vw, 14px); color: #a0c8d8;
    margin-top: 18px; text-align: center; line-height: 1.6;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="score-display"></div>

<div id="start-screen">
  <h1>fly away</h1>
  <h2>～ 纸飞机小兔 ～</h2>
  <div class="jp">ふわふわ うさぎ</div>
  <button class="btn" id="start-btn">开始游戏</button>
  <div class="controls-hint">鼠标 / 触屏拖动纸飞机<br>躲避五彩气球，飞得越远越好！<br>空格键暂停</div>
</div>

<div id="gameover-screen">
  <h2>游戏结束</h2>
  <div class="final-score" id="final-score"></div>
  <button class="btn" id="restart-btn">再来一次</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('score-display');
const startScreen = document.getElementById('start-screen');
const gameoverScreen = document.getElementById('gameover-screen');
const finalScoreEl = document.getElementById('final-score');

let W, H, dpr;
let gameState = 'start'; // start, playing, paused, gameover
let score = 0;
let bestScore = parseInt(localStorage.getItem('flyaway_best') || '0');
let frameCount = 0;
let difficulty = 1;

// --- Load sprite image ---
const spriteImg = new Image();
spriteImg.src = 'downloaded-image-3.png';
let spriteReady = false;
let spriteCanvas = null;
spriteImg.onload = () => {
  spriteCanvas = document.createElement('canvas');
  spriteCanvas.width = spriteImg.naturalWidth;
  spriteCanvas.height = spriteImg.naturalHeight;
  const cx = spriteCanvas.getContext('2d');
  cx.drawImage(spriteImg, 0, 0);
  spriteReady = true;
};

// Crop region in the original image (bunny + paper airplane area)
// Original: 2496x1664, bunny is roughly center-right

// Player
const player = {
  x: 0, y: 0,
  targetX: 0, targetY: 0,
  prevX: 0, prevY: 0,
  bobPhase: 0,
  windPhase: 0,
  tilt: 0,
  displayScale: 1,
};

let balloons = [];
let clouds = [];
let particles = [];
let hearts = [];
let trailParticles = [];

const BALLOON_COLORS = [
  { body: '#ff8fa3', shine: '#ffb3c1', string: '#d4707f' },
  { body: '#ffd166', shine: '#ffe49c', string: '#d4a840' },
  { body: '#a8e6cf', shine: '#d4f5e4', string: '#6bbf9a' },
  { body: '#b8a9e8', shine: '#d4c8f0', string: '#8a78c0' },
  { body: '#ff9a76', shine: '#ffc4a8', string: '#d47a50' },
  { body: '#87ceeb', shine: '#b8e4f5', string: '#5a9ab8' },
  { body: '#f0a0c8', shine: '#f8c8dc', string: '#c878a0' },
  { body: '#c8f0a0', shine: '#e0f8c8', string: '#98c068' },
];

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (gameState === 'start') {
    player.x = W / 2;
    player.y = H * 0.62;
    player.targetX = player.x;
    player.targetY = player.y;
    player.prevX = player.x;
    player.prevY = player.y;
  }
}
window.addEventListener('resize', resize);
resize();

// --- Drawing helpers ---

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#c0e8f0');
  grad.addColorStop(0.3, '#a8ddf0');
  grad.addColorStop(0.6, '#d0eef5');
  grad.addColorStop(1, '#e8f0f5');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawCloud(x, y, size, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#fff';
  const s = size;
  ctx.beginPath();
  ctx.ellipse(x, y, s * 1.2, s * 0.6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x - s * 0.7, y + s * 0.1, s * 0.7, s * 0.45, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + s * 0.8, y + s * 0.05, s * 0.8, s * 0.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + s * 0.1, y - s * 0.35, s * 0.7, s * 0.45, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawPlayerSprite(px, py, scale, tilt, alpha) {
  if (!spriteReady || !spriteCanvas) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(px, py);
  ctx.rotate(tilt);
  const baseScale = 0.12 * scale;
  ctx.scale(baseScale, baseScale);
  const sw = spriteCanvas.width;
  const sh = spriteCanvas.height;
  ctx.drawImage(spriteCanvas, -sw / 2, -sh / 2, sw, sh);
  ctx.restore();
}

function drawBalloon(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  const r = b.r;
  const sway = Math.sin(b.swayPhase) * b.swayAmp;

  ctx.strokeStyle = b.color.string;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(0, r * 0.9);
  ctx.quadraticCurveTo(sway * 0.5, r * 1.8, sway * 0.3, r * 2.5);
  ctx.stroke();

  const grad = ctx.createRadialGradient(-r * 0.25, -r * 0.25, r * 0.1, 0, 0, r);
  grad.addColorStop(0, b.color.shine);
  grad.addColorStop(1, b.color.body);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 0.85, r, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath();
  ctx.ellipse(-r * 0.25, -r * 0.35, r * 0.2, r * 0.28, -0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = b.color.body;
  ctx.beginPath();
  ctx.moveTo(-r * 0.08, r * 0.88);
  ctx.lineTo(r * 0.08, r * 0.88);
  ctx.lineTo(0, r * 1.02);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawHeart(x, y, size, alpha, color) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(0, size * 0.3);
  ctx.bezierCurveTo(-size * 0.5, -size * 0.3, -size, size * 0.1, 0, size);
  ctx.bezierCurveTo(size, size * 0.1, size * 0.5, -size * 0.3, 0, size * 0.3);
  ctx.fill();
  ctx.restore();
}

function drawParticle(p) {
  ctx.save();
  ctx.globalAlpha = p.alpha;
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// --- Game logic ---

function initClouds() {
  clouds = [];
  for (let i = 0; i < 10; i++) {
    clouds.push({
      x: Math.random() * W * 1.5 - W * 0.25,
      y: Math.random() * H,
      size: 30 + Math.random() * 70,
      alpha: 0.25 + Math.random() * 0.35,
      speed: 0.12 + Math.random() * 0.25,
    });
  }
}

function spawnBalloon() {
  const side = Math.random();
  let x, y, vx, vy;
  const speed = (1.2 + Math.random() * 1.5) * difficulty;

  if (side < 0.35) {
    x = -60; y = Math.random() * H * 0.8;
    vx = speed * (0.4 + Math.random() * 0.4);
    vy = -speed * 0.2 + Math.random() * speed * 0.5;
  } else if (side < 0.7) {
    x = W + 60; y = Math.random() * H * 0.8;
    vx = -speed * (0.4 + Math.random() * 0.4);
    vy = -speed * 0.2 + Math.random() * speed * 0.5;
  } else {
    x = Math.random() * W; y = H + 60;
    vx = (Math.random() - 0.5) * speed * 0.6;
    vy = -speed * 0.8;
  }

  const colorIdx = Math.floor(Math.random() * BALLOON_COLORS.length);
  const r = 18 + Math.random() * 22;

  balloons.push({
    x, y, vx, vy, r,
    color: BALLOON_COLORS[colorIdx],
    swayPhase: Math.random() * Math.PI * 2,
    swayAmp: 3 + Math.random() * 6,
    swaySpeed: 0.02 + Math.random() * 0.03,
  });
}

function spawnHeart() {
  hearts.push({
    x: player.x + (Math.random() - 0.5) * 60,
    y: player.y - 30,
    vy: -1 - Math.random() * 1.5,
    vx: (Math.random() - 0.5) * 0.8,
    size: 6 + Math.random() * 8,
    alpha: 0.8,
    color: ['#f0a0b8', '#ffd166', '#a8e6cf', '#b8a9e8'][Math.floor(Math.random() * 4)],
  });
}

function spawnExplosion(x, y) {
  for (let i = 0; i < 24; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 2 + Math.random() * 5,
      alpha: 1,
      color: BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)].body,
      life: 30 + Math.random() * 30,
    });
  }
  for (let i = 0; i < 10; i++) {
    hearts.push({
      x: x + (Math.random() - 0.5) * 50,
      y: y + (Math.random() - 0.5) * 50,
      vy: -1.5 - Math.random() * 2.5,
      vx: (Math.random() - 0.5) * 2,
      size: 8 + Math.random() * 14,
      alpha: 1,
      color: ['#f0a0b8', '#ffd166', '#ff8fa3'][Math.floor(Math.random() * 3)],
    });
  }
}

function checkCollision(b) {
  if (frameCount < 180) return false;
  const dx = player.x - b.x;
  const dy = player.y - b.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  return dist < b.r + 18;
}

function gameOver() {
  gameState = 'gameover';
  spawnExplosion(player.x, player.y);
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('flyaway_best', String(bestScore));
  }
  finalScoreEl.textContent = `得分：${score}  最高：${bestScore}`;
  setTimeout(() => { gameoverScreen.style.display = 'flex'; }, 800);
}

function resetGame() {
  score = 0;
  frameCount = 0;
  difficulty = 1;
  balloons = [];
  particles = [];
  hearts = [];
  trailParticles = [];
  player.x = W / 2;
  player.y = H * 0.62;
  player.targetX = player.x;
  player.targetY = player.y;
  player.prevX = player.x;
  player.prevY = player.y;
  player.tilt = 0;
  player.displayScale = 1;
  initClouds();
}

// --- Input ---

function onPointerMove(x, y) {
  if (gameState !== 'playing') return;
  player.targetX = x;
  player.targetY = y;
}

canvas.addEventListener('mousemove', e => onPointerMove(e.clientX, e.clientY));
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  onPointerMove(t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  onPointerMove(t.clientX, t.clientY);
}, { passive: false });

const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });

function handleKeyboard() {
  if (keys[' '] || keys['p'] || keys['P']) {
    if (gameState === 'playing') gameState = 'paused';
    else if (gameState === 'paused') gameState = 'playing';
    keys[' '] = false; keys['p'] = false; keys['P'] = false;
    return;
  }
  if (gameState !== 'playing') return;
  const speed = 6;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.targetX -= speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) player.targetX += speed;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) player.targetY -= speed;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) player.targetY += speed;
}

document.getElementById('start-btn').addEventListener('click', () => {
  startScreen.style.display = 'none';
  resetGame();
  gameState = 'playing';
});
document.getElementById('restart-btn').addEventListener('click', () => {
  gameoverScreen.style.display = 'none';
  resetGame();
  gameState = 'playing';
});

// --- Main loop ---

function update() {
  frameCount++;

  if (gameState === 'playing') {
    handleKeyboard();

    player.prevX = player.x;
    player.prevY = player.y;

    player.x += (player.targetX - player.x) * 0.1;
    player.y += (player.targetY - player.y) * 0.1;

    player.x = Math.max(50, Math.min(W - 50, player.x));
    player.y = Math.max(50, Math.min(H - 50, player.y));

    // Tilt based on horizontal velocity
    const vx = player.x - player.prevX;
    const targetTilt = Math.max(-0.18, Math.min(0.18, vx * 0.04));
    player.tilt += (targetTilt - player.tilt) * 0.08;

    // Bobbing phases
    player.bobPhase += 0.04;
    player.windPhase += 0.015;

    // Breathing scale
    const targetScale = 1 + Math.sin(player.bobPhase * 0.7) * 0.02;
    player.displayScale += (targetScale - player.displayScale) * 0.1;

    // Trail particles (wind sparkles)
    if (frameCount % 4 === 0) {
      trailParticles.push({
        x: player.x - 60 + (Math.random() - 0.5) * 20,
        y: player.y + (Math.random() - 0.5) * 15,
        vx: -0.5 - Math.random() * 1.2,
        vy: (Math.random() - 0.5) * 0.5,
        r: 1.5 + Math.random() * 2.5,
        alpha: 0.5 + Math.random() * 0.3,
        color: Math.random() > 0.5 ? '#fff' : '#ffe8f0',
        life: 20 + Math.random() * 20,
      });
    }

    score = Math.floor(frameCount / 6);
    difficulty = 1 + score / 80;

    const spawnRate = Math.max(22, 60 - Math.floor(difficulty * 4));
    if (frameCount > 120 && frameCount % spawnRate === 0) spawnBalloon();

    for (let i = balloons.length - 1; i >= 0; i--) {
      const b = balloons[i];
      b.x += b.vx;
      b.y += b.vy;
      b.swayPhase += b.swaySpeed;
      b.x += Math.sin(b.swayPhase) * 0.3;

      if (b.x < -80 || b.x > W + 80 || b.y < -120 || b.y > H + 80) {
        balloons.splice(i, 1);
        continue;
      }
      if (checkCollision(b)) { gameOver(); return; }
    }

    if (frameCount % 35 === 0) spawnHeart();
    scoreDisplay.textContent = `✦ ${score} ✦`;
  }

  // Clouds
  for (const c of clouds) {
    c.x -= c.speed;
    if (c.x < -c.size * 2.5) {
      c.x = W + c.size * 1.5;
      c.y = Math.random() * H;
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.06;
    p.alpha -= 1 / p.life;
    if (p.alpha <= 0) particles.splice(i, 1);
  }

  // Trail particles
  for (let i = trailParticles.length - 1; i >= 0; i--) {
    const p = trailParticles[i];
    p.x += p.vx; p.y += p.vy;
    p.alpha -= 1 / p.life;
    if (p.alpha <= 0) trailParticles.splice(i, 1);
  }

  // Hearts
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i];
    h.x += h.vx; h.y += h.vy;
    h.alpha -= 0.012;
    if (h.alpha <= 0) hearts.splice(i, 1);
  }
}

function draw() {
  drawSky();

  for (const c of clouds) drawCloud(c.x, c.y, c.size, c.alpha);

  for (const h of hearts) drawHeart(h.x, h.y, h.size, h.alpha * 0.4, h.color);

  for (const b of balloons) drawBalloon(b);

  // Trail sparkles behind the plane
  for (const p of trailParticles) drawParticle(p);

  // Player with animation
  if (gameState === 'playing' || gameState === 'start' || gameState === 'paused') {
    const bobY = Math.sin(player.bobPhase) * 5 + Math.sin(player.bobPhase * 1.7) * 2;
    const windX = Math.sin(player.windPhase) * 3 + Math.sin(player.windPhase * 2.3) * 1.5;
    const drawX = player.x + windX;
    const drawY = player.y + bobY;

    // Shadow beneath
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#8ab4c8';
    ctx.beginPath();
    ctx.ellipse(drawX, drawY + 55, 50 * player.displayScale, 10 * player.displayScale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    drawPlayerSprite(drawX, drawY, player.displayScale, player.tilt, 1);
  }

  for (const p of particles) drawParticle(p);
  for (const h of hearts) drawHeart(h.x, h.y, h.size, h.alpha, h.color);

  // Start screen decorations
  if (gameState === 'start') {
    ctx.save();
    const rx = W * 0.15, ry = H * 0.35;
    const colors = ['#ff8fa3', '#ffd166', '#a8e6cf', '#87ceeb', '#b8a9e8'];
    for (let i = 0; i < colors.length; i++) {
      ctx.strokeStyle = colors[i];
      ctx.lineWidth = 4;
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.arc(rx, ry, 20 + i * 4, Math.PI, 0);
      ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.translate(W * 0.32, H * 0.42);
    ctx.rotate(-0.3 + Math.sin(frameCount * 0.03) * 0.08);
    ctx.strokeStyle = '#80b8d8';
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.moveTo(-15, 0); ctx.lineTo(10, -8); ctx.lineTo(15, 0);
    ctx.lineTo(10, 5); ctx.lineTo(-15, 0);
    ctx.stroke();
    ctx.restore();
  }

  // Pause indicator
  if (gameState === 'paused') {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = 'bold 28px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⏸ 暂停  (空格继续)', W / 2, H / 2);
    ctx.restore();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

initClouds();
loop();
</script>
</body>
</html>
